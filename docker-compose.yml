version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bahiverse-postgres
    restart: always
    environment:
      POSTGRES_USER: bahiverse
      POSTGRES_PASSWORD: bahiverse_dev_password
      POSTGRES_DB: bahiverse_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bahiverse -d bahiverse_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
